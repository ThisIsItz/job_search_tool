# Deterministic pre-filter rules, read by app/filters.py. Edit these lists
# directly as you refine what "in scope" means for you — no code changes
# needed. See app/filters.py's module docstring for how they're applied.

# Unambiguous engineering-role title signals. If the title matches one of
# these, it's kept regardless of exclusion_keywords below — e.g. "Software
# Engineer, Automated Marketing" shouldn't get dropped just because
# "marketing" is also in exclusion_keywords. Keep this list short and
# genuinely unambiguous (don't add anything from title_allow_keywords
# that's also ambiguous, like bare "engineer" or "platform").
priority_title_keywords:
  - "software engineer"
  - "software developer"
  - "developer"
  - "full stack"
  - "fullstack"
  - "full-stack"
  - "frontend"
  - "front-end"
  - "front end"

# Title must match at least one of these to be considered at all.
title_allow_keywords:
  - "engineer"        # covers Engineer / Engineering Manager / Software Engineering
  - "engineering"
  - "developer"
  - "development"
  - "programmer"
  - "architect"
  - "sre"
  - "site reliability"
  - "devops"
  - "full stack"
  - "fullstack"
  - "full-stack"
  - "frontend"
  - "front-end"
  - "front end"
  - "react"
  - "ui engineer"
  - "platform"
  - "tech lead"
  - "technical lead"

# Even if the title matched the allowlist above, drop it if it also
# matches one of these — engineering-adjacent titles that aren't a fit.
exclusion_keywords:
  - "accountant"
  - "accounting"
  - "nurse"
  - "nursing"
  - "lawyer"
  - "attorney"
  - "paralegal"
  - "chemist"
  - "chemistry"
  - "electrician"
  - "plumber"
  - "welder"
  - "sales representative"
  - "account executive"
  - "sales engineer"
  - "sales development"
  - "business development representative"
  - "recruiter"
  - "talent acquisition"
  - "talent brand"
  - "warehouse"
  - "forklift"
  - "driver"
  - "cdl"
  - "teacher"
  - "professor"
  - "dentist"
  - "physician"
  - "pharmacist"
  - "mechanical engineer"
  - "electrical engineer"
  - "civil engineer"
  - "chemical engineer"
  - "industrial engineer"
  - "manufacturing engineer"
  - "hardware engineer"
  - "process engineer"
  - "field engineer"
  - "customer success"
  - "account manager"
  - "marketing"
  - "copywriting"
  - "compliance"
  - "product marketing"

# Location doesn't matter beyond "must be remote" — worldwide is fine
# (contractor/part-time roles are fine too; nothing filters on employment
# type). Matches any location string that signals remote work at all,
# with no country/region qualifier required.
location_allow_patterns:
  - '\bremote\b'
  - '\banywhere\b'
  - '\bworldwide\b'
  - '\bglobal\b'
  - '\bwork from home\b'
  - '\bwfh\b'

# EDIT ME FIRST (along with stack_core below): JD stack dealbreakers — if
# the description clearly requires one of these languages/frameworks and
# does NOT also mention anything from stack_core, treat it as a mismatch.
# Ships assuming a Python/JS candidate who wants to exclude
# Java/C#/.NET/etc — if your own stack includes one of these "dealbreaker"
# languages, move it down into stack_core instead, or this will reject
# roles in your own stack. Only runs when a description is
# available. Word-boundary matched to avoid e.g. "java" matching
# "javascript". Deliberately NOT including bare "go" — too ambiguous
# ("go-to-market", "go live", etc.); "golang" below covers it, and most Go
# postings also say "Golang" or "Go (Golang)" somewhere in the JD.
stack_dealbreakers:
  - '\bjava\b'
  - '\bc#\b'
  - '\.net\b'
  - '\bgolang\b'
  - '\bruby\b'
  - '\brails\b'
  - '\bphp\b'
  - '\bkotlin\b'
  - '\bswift\b'
  - '\bscala\b'
  - '\bc\+\+\b'

# Your own core stack — if the JD mentions any of these, a stack dealbreaker
# match above is ignored (the role likely uses both, or the dealbreaker
# keyword is a false positive).
stack_core:
  - '\bpython\b'
  - '\bfastapi\b'
  - '\bdjango\b'
  - '\bflask\b'
  - '\bjavascript\b'
  - '\btypescript\b'
  - '\breact\b'
  - '\bnode(?:\.?js)?\b'
  - '\bvue\b'
  - '\bnext\.?js\b'

# Backend-only titles are rejected unconditionally, even if they'd
# otherwise match priority_title_keywords (e.g. "Senior Software Engineer,
# Backend" contains "software engineer") — unless the title itself also
# carries a frontend signal (frontend_signal_patterns below), in which
# case it's full-stack-shaped and handled by the full-stack check instead.
backend_title_keywords:
  - "backend"
  - "back-end"
  - "back end"

# A title matching "full stack"/"fullstack"/"full-stack" only passes if
# the JD also shows a real frontend signal from this list — otherwise it's
# treated as a backend role with a full-stack label tacked on. Only runs
# when a description is available (unknown JD -> benefit of the doubt,
# don't reject).
full_stack_title_keywords:
  - "full stack"
  - "fullstack"
  - "full-stack"

frontend_signal_patterns:
  - '\breact\b'
  - '\bvue\b'
  - '\bangular\b'
  - '\bfront[- ]?end\b'
  - '\bcss\b'
  - '\bhtml\b'
  - '\btailwind\b'
  - '\bredux\b'
  - '\bzustand\b'
  - '\btanstack\b'
  - '\bdesign system\b'
  - '\buser interface\b'
  - '\bux\b'
  - '\bnext\.?js\b'

# Below this many characters, a JD is treated as a short aggregator teaser
# snippet rather than a full posting (see app/filters.py's looks_truncated).
truncated_description_min_chars: 400
