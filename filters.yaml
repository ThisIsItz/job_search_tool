# Deterministic filter rules, read by app/filters.py. Deliberately minimal:
# they only drop what's obviously out (non-technical titles, stale postings).
# Location, remote/hybrid, role type, seniority and stack are judged by
# app/ai_filter.py from the full posting instead.

# Unambiguous engineering/design title signals. If the title matches one of
# these, exclusion_keywords below don't apply — e.g. "Software Engineer,
# Automated Marketing" shouldn't get dropped just because "marketing" is
# also in exclusion_keywords. Keep this list short and genuinely
# unambiguous (not bare "engineer", or "Sales Engineer" would slip through).
priority_title_keywords:
  - "software engineer"
  - "software developer"
  - "developer"
  - "full stack"
  - "fullstack"
  - "full-stack"
  - "frontend"
  - "front-end"
  - "front end"
  - "designer"
  - "desarrollador"
  - "desarrolladora"
  - "programador"
  - "programadora"

# Titles that look technical. NOT used to drop jobs — only to decide which
# jobs are worth an extra request for their full description (Adzuna,
# SmartRecruiters), so a title missing here still reaches the AI filter.
title_allow_keywords:
  - "engineer"        # covers Engineer / Engineering Manager / Software Engineering
  - "engineering"
  - "developer"
  - "development"
  - "programmer"
  - "architect"
  - "sre"
  - "site reliability"
  - "devops"
  - "full stack"
  - "fullstack"
  - "full-stack"
  - "frontend"
  - "front-end"
  - "front end"
  - "react"
  - "ui engineer"
  - "platform"
  - "tech lead"
  - "technical lead"
  - "designer"
  - "technical staff"
  - "sde"
  - "technologist"
  - "desarrollador"
  - "desarrolladora"
  - "programador"
  - "programadora"
  - "ingeniero"
  - "ingeniera"

# A job whose title matches one of these is dropped (unless it also matches
# priority_title_keywords) — titles that are obviously not a fit.
exclusion_keywords:
  - "accountant"
  - "accounting"
  - "nurse"
  - "nursing"
  - "lawyer"
  - "attorney"
  - "paralegal"
  - "chemist"
  - "chemistry"
  - "electrician"
  - "plumber"
  - "welder"
  - "sales representative"
  - "account executive"
  - "sales engineer"
  - "sales development"
  - "business development representative"
  - "recruiter"
  - "talent acquisition"
  - "talent brand"
  - "warehouse"
  - "forklift"
  - "driver"
  - "cdl"
  - "teacher"
  - "professor"
  - "dentist"
  - "physician"
  - "pharmacist"
  - "mechanical engineer"
  - "electrical engineer"
  - "civil engineer"
  - "chemical engineer"
  - "industrial engineer"
  - "manufacturing engineer"
  - "hardware engineer"
  - "process engineer"
  - "field engineer"
  - "customer success"
  - "account manager"
  - "marketing"
  - "copywriting"
  - "compliance"
  - "product marketing"

# Below this many characters, a JD is treated as a short aggregator teaser
# snippet rather than a full posting (see app/filters.py's looks_truncated).
truncated_description_min_chars: 400

# A posting older than this many days is rejected. Some ATSes (Ashby in
# particular) report the role's original publish date rather than a
# last-still-open date, so an evergreen posting can look years old and get
# rejected here even if it's still accepting applications — if that's a
# problem in practice, raise this or drop the check for one company.
max_posting_age_days: 45
