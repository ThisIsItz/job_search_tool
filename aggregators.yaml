# Broad-coverage job aggregators (as opposed to companies.yaml, which is
# one board per company). These search across many employers at once using
# keyword + location, so they catch companies you haven't identified yet —
# at the cost of more noise, which is exactly what filters.py exists for.
#
# type: one of "adzuna" | "remotive" | "remoteok" | "jobicy" | "weworkremotely" | "jobspy"
# params: passed straight through to that aggregator's search API, EXCEPT
#   max_pages (adzuna only) — a pipeline-level control consumed by
#   fetch_adzuna() before building the request, not sent to Adzuna itself.
#
# Adzuna's `where` param is a GEOGRAPHIC field (city/region/country) — it
# doesn't recognize "remote" as a place, so `where: "remote"` silently
# returns 0 results every time (confirmed live 2026-09-22). Put "remote" in
# `what` (the keyword search) instead; fetch_adzuna() then normalizes the
# returned location field so filters.yaml's location_allow_patterns still
# match. `where` is left unset below so results aren't narrowed to one
# city/region within the country.

aggregators:
  - name: Adzuna (UK, remote frontend/react)
    type: adzuna
    params:
      what: "frontend engineer remote"
      country: "gb"
      results_per_page: 50
      max_pages: 5   # up to 250 results; stops early if a page comes back short
    notes: >
      Requires free app_id/app_key from https://developer.adzuna.com (instant
      signup, no approval wait per their docs — exact rate limit wasn't
      confirmed in research, check your account dashboard after signup).
      Set ADZUNA_APP_ID / ADZUNA_APP_KEY as environment variables.

  - name: Adzuna (UK, remote full stack)
    type: adzuna
    params:
      what: "full stack engineer remote"
      country: "gb"
      results_per_page: 50
      max_pages: 5

  - name: Adzuna (Spain, remote frontend/react)
    type: adzuna
    params:
      what: "frontend engineer remote"
      country: "es"
      results_per_page: 50
      max_pages: 5

  - name: Adzuna (Germany, remote frontend/react)
    type: adzuna
    params:
      what: "frontend engineer remote"
      country: "de"
      results_per_page: 50
      max_pages: 5

  - name: Adzuna (US, remote frontend/react)
    type: adzuna
    params:
      what: "frontend engineer remote"
      country: "us"
      results_per_page: 50
      max_pages: 5

  - name: Remotive (software-dev category)
    type: remotive
    params:
      category: "software-dev"
    notes: >
      No auth needed. Remote-only listings. Remotive asks for max 4
      requests/day and max 2/minute — keep this to one call per pipeline
      run. Listings are delayed 24h from posting per their terms.

  - name: RemoteOK (latest postings)
    type: remoteok
    params: {}
    notes: >
      No auth needed. Always returns the latest ~100 postings across all
      categories (tag/location query params don't actually filter
      server-side, confirmed live) — filters.yaml's title/stack rules do
      the real filtering. Every listing is remote by construction.

  - name: Jobicy (dev tag, Europe)
    type: jobicy
    params:
      count: 50
      tag: "dev"
      geo: "europe"
    notes: >
      No auth needed. `geo` really does filter server-side (confirmed
      live) — "europe" here since that's most relevant given EU/UK
      eligibility, but location doesn't otherwise matter for you, so a
      second entry with geo left out (or set to "usa") would widen this.

  - name: Jobicy (dev tag, worldwide)
    type: jobicy
    params:
      count: 50
      tag: "dev"

  - name: WeWorkRemotely (programming)
    type: weworkremotely
    params:
      category: "remote-programming-jobs"
    notes: >
      No auth needed. RSS, not JSON. Only returns the latest ~25 postings
      per fetch (no pagination) — filters.yaml's title/stack rules do the
      real filtering, same as RemoteOK. Every listing is remote by
      construction.

  - name: LinkedIn via JobSpy (Spain, remote frontend)
    type: jobspy
    params:
      site_name: ["linkedin"]
      search_term: "frontend engineer"
      location: "Spain"
      is_remote: true
      hours_old: 72
      results_wanted: 50
    notes: >
      Scrapes LinkedIn's public (logged-out) job search — no account, so no
      account-ban risk. LinkedIn rate-limits by IP (429s / empty results)
      somewhere around 10 pages, so keep results_wanted modest. Params go
      straight to jobspy.scrape_jobs.

  - name: Indeed via JobSpy (Spain, remote frontend)
    type: jobspy
    params:
      site_name: ["indeed"]
      search_term: "frontend engineer"
      location: "Spain"
      country_indeed: "spain"
      is_remote: true
      results_wanted: 50
    notes: >
      Indeed only honours ONE of hours_old / (job_type + is_remote) /
      easy_apply per search — combining hours_old with is_remote returned 0
      results live (2026-11-23), so hours_old is left out here. Dedup
      already skips anything seen on a previous run.

  # Spanish-language searches: Spanish employers often title roles
  # "Desarrollador/a Frontend", which the English search terms above miss.
  - name: Indeed via JobSpy (Spain, remote, desarrollador frontend)
    type: jobspy
    params:
      site_name: ["indeed"]
      search_term: "desarrollador frontend"
      location: "Spain"
      country_indeed: "spain"
      is_remote: true
      results_wanted: 50

  - name: Indeed via JobSpy (Spain, remote, desarrollador full stack)
    type: jobspy
    params:
      site_name: ["indeed"]
      search_term: "desarrollador full stack"
      location: "Spain"
      country_indeed: "spain"
      is_remote: true
      results_wanted: 50

  - name: LinkedIn via JobSpy (Spain, remote, desarrollador frontend)
    type: jobspy
    params:
      site_name: ["linkedin"]
      search_term: "desarrollador frontend"
      location: "Spain"
      is_remote: true
      hours_old: 72
      results_wanted: 25
    notes: >
      Smaller results_wanted than the English LinkedIn search above: both
      hit LinkedIn from the same IP each run, and it starts returning 429s
      after roughly 10 pages in total.
