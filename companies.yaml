# Company registry for the job discovery pipeline.
# ats: one of "greenhouse" | "ashby" | "workable" | "lever" | "smartrecruiters"
# slug: the identifier used in that ATS's public API URL
#
# Replaced 2026-09-22: the original author's Alberta/Canada target list is
# gone. This list is remote-first / remote-friendly companies known to hire
# frontend engineers, curated for a 100%-remote React/TypeScript search with
# no location constraint. Every slug below was verified live against its
# real ATS API endpoint before being added (not guessed) — see each
# fetch_* function in app/ats_clients.py for the exact endpoint checked.
# Add/remove freely; if you add one yourself, verify the slug the same way
# (a wrong slug just silently returns 0 jobs, logged as a warning, not an
# error) — check `python -m app.main --company <slug>` before trusting it.

companies:
